<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ===== RESET ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

/* ===== BODY ===== */
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0b0b0f;
    overflow: hidden;
}

/* ===== BLOBS ===== */
body::before, body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 0;
}

body::before {
    width: 450px;
    height: 450px;
    background: linear-gradient(45deg, #ff512f, #dd2476);
    bottom: -120px;
    right: -120px;
}

body::after {
    width: 450px;
    height: 450px;
    background: linear-gradient(45deg, #7f00ff, #e100ff);
    top: -120px;
    left: -120px;
}

/* ===== CARD ===== */
.container {
    position: relative;
    z-index: 2;
    width: 360px;
    padding: 35px;
    border-radius: 25px;

    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(25px);
    border: 1px solid rgba(255,255,255,0.2);

    box-shadow: 0 0 50px rgba(0,0,0,0.6);
}

/* ===== TEXT ===== */
.container h1 {
    color: #fff;
    font-weight: 600;
}

.container p {
    color: #bbb;
    font-size: 12px;
    margin-bottom: 25px;
}

/* ===== INPUT ===== */
.input-box {
    position: relative;
    margin-bottom: 15px;
}

.input-box input {
    width: 100%;
    padding: 12px 40px 12px 15px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.3);
    background: transparent;
    color: #fff;
    outline: none;
}

.input-box span {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #ccc;
}

/* ===== BUTTON ===== */
button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, #ff512f, #ff7b00);
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #ff512f;
}

/* ===== LINKS ===== */
.links {
    text-align: center;
    margin-top: 15px;
}

.links a {
    color: #ccc;
    font-size: 12px;
    text-decoration: none;
}

.links a:hover {
    color: white;
}

/* ===== DOT ===== */
.dot {
    position: absolute;
    width: 40px;
    height: 40px;
    background: radial-gradient(circle, #ff7b00, transparent);
    border-radius: 50%;
    bottom: 60px;
    left: 60px;
    filter: blur(10px);
}

</style>
</head>

<body>

<div class="container">
    <h1>Signup</h1>
    <p>CREATE YOUR ACCOUNT</p>

    <!-- FULL NAME -->
    <div class="input-box">
        <input type="text" id="name" placeholder="Full Name">
        <span>👤</span>
    </div>

    <!-- EMAIL -->
    <div class="input-box">
        <input type="email" id="email" placeholder="Email Address">
        <span>📧</span>
    </div>

    <!-- PASSWORD -->
    <div class="input-box">
        <input type="password" id="password" placeholder="Password">
        <span>🔒</span>
    </div>

    <!-- CONFIRM PASSWORD -->
    <div class="input-box">
        <input type="password" id="confirm" placeholder="Confirm Password">
        <span>🔒</span>
    </div>

    <!-- BUTTON -->
    <button onclick="signup()">SIGN UP</button>

    <div class="links">
        <a href="index.html">Already have an account? Login</a>
    </div>
</div>

<div class="dot"></div>

<script>
function signup() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("password").value.trim();
    const confirm = document.getElementById("confirm").value.trim();

    if (!name || !email || !pass || !confirm) {
        alert("Please fill all fields");
        return;
    }

    if (pass !== confirm) {
        alert("Passwords do not match");
        return;
    }

    let users = JSON.parse(localStorage.getItem("users")) || [];

    // check if email already exists
    const exists = users.find(u => u.email === email);
    if (exists) {
        alert("Email already registered");
        return;
    }

    users.push({
        name: name,
        email: email,
        password: pass
    });

    localStorage.setItem("users", JSON.stringify(users));

    alert("Account created!");
    window.location.href = "index.html"; // your login page
}
</script>
</body>
</html>
