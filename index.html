<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

/* BODY */
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0b0b0f;
    overflow: hidden;
}

/* BLOBS */
body::before, body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 0;
}

body::before {
    width: 450px;
    height: 450px;
    background: linear-gradient(45deg, #ff512f, #dd2476);
    bottom: -120px;
    right: -120px;
}

body::after {
    width: 450px;
    height: 450px;
    background: linear-gradient(45deg, #7f00ff, #e100ff);
    top: -120px;
    left: -120px;
}

/* CARD */
.container {
    position: relative;
    z-index: 2;
    width: 360px;
    padding: 35px;
    border-radius: 25px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(25px);
    border: 1px solid rgba(255,255,255,0.2);
}

/* TEXT */
.container h1 { color: #fff; }
.container p { color: #bbb; font-size: 12px; margin-bottom: 25px; }

/* INPUT */
.input-box { position: relative; margin-bottom: 18px; }

.input-box input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.3);
    background: transparent;
    color: #fff;
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, #ff512f, #ff7b00);
    color: white;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #ff512f;
}

/* LINKS */
    .links a {
    color: #ccc;
    font-size: 12px;
    text-decoration: none;
    position: relative;
    transition: 0.3s;
.links { text-align: center; margin-top: 15px; }
.links p { cursor: pointer; color: #ccc; }

/* SIGNUP */
.signup {
    margin-top: 20px;
    text-align: center;
    font-size: 12px;
    color: #bbb;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: #111;
    padding: 25px;
    border-radius: 15px;
    width: 300px;
    color: white;
    text-align: center;
    animation: popup 0.3s ease;
}

/* FIXED ANIMATION */
        /* POPUP ANIMATION */
@keyframes popup {
    from {
        opacity: 0;
        transform: scale(0.7) translateY(-20px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}
/* MODAL BACKGROUND */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
    z-index: 10;
}

.modal-content {
    background: #111;
    padding: 25px;
    border-radius: 15px;
    width: 300px;
    color: white;
    text-align: center;
    position: relative;
}

.modal-content input {
    width: 100%;
    margin: 10px 0;
    padding: 10px;
    border-radius: 8px;
    border: none;
}

.close {
    position: absolute;
    top: 10px;
    right: 15px;
    cursor: pointer;
}


</style>
</head>

<body>

<div class="container">
    <h1>Login</h1>
    <p>WELCOME BACK PLEASE LOGIN</p>

    <div class="input-box">
        <input type="email" id="email" placeholder="Email">
    </div>

    <div class="input-box">
        <input type="password" id="password" placeholder="Password">
    </div>

    <button onclick="login()">LOGIN</button>

    <div class="links">
        <p onclick="openForgot()">Forgot Password</p>
    </div>

    <div class="signup">
        Don’t have an account? <a href="sign up.html">Signup</a>
    </div>
</div>

<!-- MODAL -->
<div id="forgotModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>

    <h3>Reset Password</h3>

    <input id="resetEmail" type="email" placeholder="Email">
    <input id="newPassword" type="password" placeholder="New Password">
    <input id="confirmPassword" type="password" placeholder="Confirm Password">

    <button onclick="resetPassword()">Confirm</button>
  </div>
</div>

<script>

/* OPEN MODAL */
function openForgot() {
    document.getElementById("forgotModal").style.display = "flex";
}

/* CLOSE MODAL */
function closeModal() {
    document.getElementById("forgotModal").style.display = "none";
}

/* CLICK OUTSIDE CLOSE */
window.onclick = function(e) {
    let modal = document.getElementById("forgotModal");
    if (e.target === modal) {
        modal.style.display = "none";
    }
}

/* LOGIN */
function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
        alert("Please fill all fields");
        return;
    }

    const users = JSON.parse(localStorage.getItem("users")) || [];

    if (users.length === 0) {
        alert("No account found. Please sign up first.");
        return;
    }

    const user = users.find(u => u.email.trim() === email);

    if (!user) {
        alert("Account not found");
        return;
    }

    if (user.password !== password) {
        alert("Incorrect password");
        return;
    }

    alert("Login successful!");
    window.location.href = "home.html";
}

/* RESET PASSWORD */
function resetPassword(){
    let email = document.getElementById("resetEmail").value.trim();
    let users = JSON.parse(localStorage.getItem("users")) || [];

    let index = users.findIndex(u => u.email.trim() === email);

    if(index === -1){
        alert("Email not found!");
        return;
    }

    let newPassword = document.getElementById("newPassword").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if(newPassword !== confirmPassword){
        alert("Passwords do not match!");
        return;
    }

    users[index].password = newPassword;
    localStorage.setItem("users", JSON.stringify(users));

    alert("Password changed successfully!");

    document.getElementById("resetEmail").value = "";
    document.getElementById("newPassword").value = "";
    document.getElementById("confirmPassword").value = "";

    closeModal();
}

</script>

</body>
</html>
