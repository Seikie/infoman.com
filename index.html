<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

    /* ===== FORGOT PASSWORD MODAL POPUP ANIMATION ===== */

.forgot-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(5px);
    justify-content: center;
    align-items: center;
    z-index: 999;
}

.forgot-modal.active {
    display: flex;
    animation: fadeBackground 0.3s ease;
}


.forgot-box {
    background: #111;
    padding: 30px;
    border-radius: 15px;
    width: 350px;
    text-align: center;

    /* popup animation */
    animation: popup 0.35s ease;
}


/* Popup effect */
@keyframes popup {
    from {
        opacity: 0;
        transform: scale(3) translateY(-30px);
    }

    to {
        opacity: 1;
        transform: scale(5) translateY(0);
    }
}


/* Background fade */
@keyframes fadeBackground {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}



/* ===== CURSOR POINTER ANIMATION ===== */

.forgot-box button,
.forgot-box a {
    cursor: pointer;
    transition: 
        transform 0.2s ease,
        box-shadow 0.2s ease;
}


.forgot-box button:hover,
.forgot-box a:hover {

    transform: scale(1.08);
    box-shadow: 0 0 15px orange;
}


.forgot-box button:active,
.forgot-box a:active {

    transform: scale(0.92);
}

/* ===== RESET ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

/* ===== BODY ===== */
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0b0b0f;
    overflow: hidden;
}

/* ===== BLOBS ===== */
body::before, body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 0;
}

body::before {
    width: 450px;
    height: 450px;
    background: linear-gradient(45deg, #ff512f, #dd2476);
    bottom: -120px;
    right: -120px;
}

body::after {
    width: 450px;
    height: 450px;
    background: linear-gradient(45deg, #7f00ff, #e100ff);
    top: -120px;
    left: -120px;
}

/* ===== CARD ===== */
.container {
    position: relative;
    z-index: 2;
    width: 360px;
    padding: 35px;
    border-radius: 25px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(25px);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 50px rgba(0,0,0,0.6);
}

/* ===== TEXT ===== */
.container h1 { color: #fff; }
.container p { color: #bbb; font-size: 12px; margin-bottom: 25px; }

/* ===== INPUT ===== */
.input-box { position: relative; margin-bottom: 18px; }

.input-box input {
    width: 100%;
    padding: 12px 40px 12px 15px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.3);
    background: transparent;
    color: #fff;
}

.input-box span {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
}

/* ===== REMEMBER ===== */
.remember {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #ccc;
    margin-bottom: 20px;
}

/* ===== BUTTON ===== */
button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, #ff512f, #ff7b00);
    color: white;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #ff512f;
}

/* ===== LINKS ===== */
.links a {
    color: #ccc;
    font-size: 12px;
    text-decoration: none;
    position: relative;
    transition: 0.3s;
}
.links { text-align: center; margin-top: 15px; }
.links p { cursor: pointer; color: #ccc; }

/* ===== SIGNUP ===== */
.signup {
    margin-top: 20px;
    text-align: center;
    font-size: 12px;
    color: #bbb;
}

.signup a {
    color: white;
    text-decoration: none;
    position: relative;
    transition: 0.3s;
}

/* underline animation */
.signup a::after {
    content: "";
    position: absolute;
    width: 0%;
    height: 2px;
    left: 0;
    bottom: -3px;
    background: linear-gradient(90deg, #ff512f, #ff7b00);
    transition: 0.3s;
}

.signup a:hover::after {
    width: 100%;
}

/* glow + lift */
.signup a:hover {
    color: #ff7b00;
    transform: translateY(-2px);
}

.signup { margin-top: 20px; text-align: center; font-size: 12px; color: #bbb; }
.signup a { color: white; }

/* ===== DOT ===== */
.dot {
    position: absolute;
    width: 40px;
    height: 40px;
    background: radial-gradient(circle, #ff7b00, transparent);
    border-radius: 50%;
    bottom: 60px;
    left: 60px;
    filter: blur(10px);
}

/* ===== MODAL ===== */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
    z-index: 10;
}

.modal-content {
    background: #111;
    padding: 25px;
    border-radius: 15px;
    width: 300px;
    color: white;
    text-align: center;
    position: relative;
}

.modal-content input {
    width: 100%;
    margin: 10px 0;
    padding: 10px;
    border-radius: 8px;
    border: none;
}

.close {
    position: absolute;
    top: 10px;
    right: 15px;
    cursor: pointer;
}


</style>
</head>

<body>

<div class="container">
    <h1>Login</h1>
    <p>WELCOME BACK PLEASE LOGIN</p>

    <div class="input-box">
        <input type="email" id="email" placeholder="Email">
    </div>

    <div class="input-box">
        <input type="password" id="password" placeholder="Password">
        <span onclick="togglePass()">👁</span>
    </div>

    <button onclick="login()">LOGIN</button>

    <div class="links">
        <p onclick="openForgot()">Forgot Password</p>
    </div>

     <div class="signup">
        Don’t have an account? <a href="sign up.html">Signup</a>
    </div>
</div>

<div id="forgotModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>

    <h3>Reset Password</h3>

    <input id="resetEmail" type="email" placeholder="Email">
    <input id="newPassword" type="password" placeholder="New Password">
    <input id="confirmPassword" type="password" placeholder="Confirm Password">

    <button onclick="resetPassword()">Confirm</button>
  </div>
</div>
<script>

    function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
        alert("Please fill all fields");
        return;
    }

    const users = JSON.parse(localStorage.getItem("users"));

    
    if (!users || users.length === 50) {
        alert("No account found. Please sign up first.");
        return;
    }

    const user = users.find(u => u.email === email);

    if (!user) {
        alert("Account not found");
        return;
    }

    if (user.password !== password) {
        alert("Incorrect password");
        return;
    }
    if (email || password){
     alert("Login successful!");
    window.location.href = "home.html";
}


    function resetPassword() {

    let email = document.getElementById("resetEmail").value;
    let newPass = document.getElementById("newPassword").value;
    let confirmPass = document.getElementById("confirmPassword").value;


    if(email === "" || newPass === "" || confirmPass === ""){
        alert("Please fill all fields!");
        return;
    }


    if(newPass !== confirmPass){
        alert("Passwords do not match!");
        return;
    }


    // Get saved account
    let user = JSON.parse(localStorage.getItem("user"));


    if(!user || user.email !== email){
        alert("Email not found!");
        return;
    }


    // Change password
    user.password = newPass;

    localStorage.setItem("user", JSON.stringify(user));


    alert("Password successfully changed!");


    // Close modal
    closeModal();


    // Clear fields
    document.getElementById("resetEmail").value = "";
    document.getElementById("newPassword").value = "";
    document.getElementById("confirmPassword").value = "";
}


function closeModal(){
    document.getElementById("forgotModal").style.display = "none";
}

function togglePass() {
    const pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}



</script>

</body>
</html>
