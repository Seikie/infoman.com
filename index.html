<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #6a00f4, #ff6a00);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* LOGIN CARD */
.container {
    background: #111;
    padding: 30px;
    border-radius: 15px;
    width: 300px;
    color: white;
    text-align: center;
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: none;
}

button {
    width: 100%;
    padding: 10px;
    background: orange;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

a {
    color: violet;
    cursor: pointer;
}

/* MODAL */
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.6);
}

.modal.active {
    display: flex;
}

.modal-content {
    background: #222;
    padding: 20px;
    border-radius: 10px;
    width: 300px;
    color: white;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">
    <h2>Login</h2>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">LOGIN</button>

    <p><a onclick="openForgot()">Forgot Password?</a></p>

    <p>Don't have an account? <a href="index.html">Signup</a></p>
</div>

<!-- MODAL -->
<div class="modal" id="forgotModal">
    <div class="modal-content">
        <h3>Reset Password</h3>

        <input type="email" id="resetEmail" placeholder="Email">
        <input type="password" id="newPassword" placeholder="New Password">
        <input type="password" id="confirmPassword" placeholder="Confirm Password">

        <button onclick="resetPassword()">Confirm</button>
        <br><br>
        <button onclick="closeModal()">Close</button>
    </div>
</div>

<script>

// LOGIN
function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Enter email and password");
        return;
    }

    let user = JSON.parse(localStorage.getItem("user"));

    if (!user || user.email !== email || user.password !== password) {
        alert("Invalid login");
        return;
    }

    alert("Login successful!");

    // redirect (normal na magrereset inputs)
    window.location.href = "home.html";
}


// OPEN MODAL
function openForgot() {
    document.getElementById("forgotModal").classList.add("active");
}


// CLOSE MODAL
function closeModal() {
    document.getElementById("forgotModal").classList.remove("active");
}


// RESET PASSWORD
function resetPassword() {

    let email = document.getElementById("resetEmail").value;
    let newPass = document.getElementById("newPassword").value;
    let confirmPass = document.getElementById("confirmPassword").value;

    if (email === "" || newPass === "" || confirmPass === "") {
        alert("Please fill all fields!");
        return;
    }

    if (newPass !== confirmPass) {
        alert("Passwords do not match!");
        return;
    }

    let user = JSON.parse(localStorage.getItem("user"));

    if (!user || user.email !== email) {
        alert("Email not found!");
        return;
    }

    user.password = newPass;
    localStorage.setItem("user", JSON.stringify(user));

    alert("Password changed!");

    closeModal();
}


// CLICK OUTSIDE MODAL
window.onclick = function(e) {
    let modal = document.getElementById("forgotModal");
    if (e.target === modal) {
        modal.classList.remove("active");
    }
}

</script>

</body>
</html>
